# Moodle-specific Apache settings, included at the end of the stock vhost
# (after the Insula platform overrides from apache-php).
#
# The document root is code/public: since Moodle 5.1 everything web-facing
# lives there, and config.php, admin/cli, vendor/ and moodledata/ are outside
# it, so they cannot be requested at all.
<Directory /var/www/moodle/code/public>
    DirectoryIndex index.php
    # Moodle's router (r.php) answers every request for a file that does not
    # exist; config.php declares it with $CFG->routerconfigured = true.
    FallbackResource /r.php
    # pluginfile.php/1/…, file.php/… and friends carry the file in PATH_INFO
    # ("slash arguments").
    AcceptPathInfo On
</Directory>

# FallbackResource never sees a missing *.php: the stock vhost hands every
# *.php straight to PHP-FPM, which answers 404 itself. Moodle routes such paths
# too (old script URLs it now serves from r.php), so send a .php request for a
# file that does not exist to the router. Requests with the .php in the MIDDLE
# (pluginfile.php/1/…/name.php) are slash arguments of a real script and are
# left alone.
RewriteCond %{REQUEST_URI} \.php$
RewriteCond %{REQUEST_URI} !\.php/
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^ /r.php [PT,L]
